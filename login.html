<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Moon Mary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="register-section">
        <div class="login-box">

            <a href="index.html" class="logo"><svg class="logo-moon" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M72 12a42 42 0 1 0 0 76c-26-13-26-63 0-76Z" fill="#f2c94c"/></svg><span>Moon Mary</span></a>

            <h1>Bem-vinda(o) de volta!</h1>
            <p>Entre na sua conta para continuar suas compras.</p>

            <form>
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>

                <button type="submit" class="main-button">
                    Entrar
                </button>
            </form>

            <p class="register-login">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

            <p class="register-login">
                <a href="index.html">Voltar para a loja</a>
            </p>
<p class="register-login">
                <base href="index.html">Welcome to your little universe.</base>
            </p>
        </div>
    </section>

</body>
</html>
